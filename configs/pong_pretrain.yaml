# ==========================================
# CONFIGURAÇÃO DE PRÉ-TREINO (MineRL)
# ==========================================

dataset:
  train_path: "datasets/pong/train"
  test_path: "datasets/pong/test"
  img_size: 64
  # Mapeamento de ações MineRL -> Robô (0:Stop, 1:Fwd, 2:Back, 3:Left, 4:Right)
  # O código usará heurísticas (camera_x, forward, etc) para decidir
  action_mapping: true
  
model:
  input_shape: [3, 64, 64]
  n_actions: 3        # Stop, Fwd, Back, Left, Right
  n_categories: 64    # Tamanho do codebook latente
  hidden_size: 128
  
training:
  experiment_name: "pong_pretrain_v1"
  output_dir: "models/"
  model_name: "visual_world_model_pong"
  
  epochs: 30
  batch_size: 64      # Ajuste conforme sua VRAM (32 ou 64 é seguro pra 64x64)
  learning_rate: 0.001
  save_every_step: 1000
  
  # Pesos da Loss
  beta_rec: 1.0       # Peso da Reconstrução (Visão)
  beta_pred: 1      # Peso da Predição (Física)
  beta_inverse: 1

  beta_entropy: 0.01